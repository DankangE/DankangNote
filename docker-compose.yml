services:
  db:
    image: postgres:17-alpine
    container_name: dankangnote-db
    environment:
      POSTGRES_USER: dankang
      POSTGRES_PASSWORD: dankang
      POSTGRES_DB: dankangnote
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # 파일 첨부 스토리지 (KAN-35). S3 호환 API라 스테이징에서는 컨테이너 대신 관리형
  # 서비스(R2·S3 등)로 env만 바꿔 간다. 포트 9000은 브라우저가 presigned URL로 직접
  # 업로드/다운로드하는 경로라 반드시 호스트에 노출돼야 한다.
  minio:
    image: minio/minio:latest
    container_name: dankangnote-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: dankang
      MINIO_ROOT_PASSWORD: dankang-minio
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

  # 버킷을 한 번 만들어 두는 init 컨테이너 — 앱이 부팅마다 버킷 존재를 확인하는 비용과
  # 그 실패 경로를 들이지 않기 위해서다. 이미 있으면 아무 일도 하지 않는다.
  minio-init:
    image: minio/mc:latest
    container_name: dankangnote-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dankang dankang-minio; do sleep 1; done;
      mc mb --ignore-existing local/dankangnote-attachments;
      "

volumes:
  db-data:
  minio-data:
