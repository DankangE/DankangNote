name: CI

# PR과 main 푸시에서 돈다. tsc·lint·test·build를 로컬 수동 확인에 의존하지 않게 하는 것이
# 이 워크플로의 목적이다 (로드맵 NEW-04).
on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연속 푸시하면 이전 실행은 취소한다 — 마지막 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입·린트·테스트·빌드
    runs-on: ubuntu-latest

    # 서비스 계층 테스트는 실제 Postgres를 쓴다 — 멀티테넌시 격리가 SQL where 절에
    # 살아 있어서 목으로는 검증되지 않기 때문이다(.claude/rules/testing.md).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dankang
          POSTGRES_PASSWORD: dankang
          POSTGRES_DB: dankangnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dankang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 테스트 하네스는 이 URL의 DB명 + '_test'를 파생해 쓰고, 없으면 migrate deploy가
      # 만든다. 빌드도 DATABASE_URL을 요구한다(라우트 수집 단계에서 Prisma 클라이언트 생성).
      # Clerk·Pusher 키는 전 라우트가 동적이라 빌드에 필요 없다 — 실측 확인.
      DATABASE_URL: postgresql://dankang:dankang@localhost:5432/dankangnote

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      # postinstall의 prisma generate가 여기서 함께 돈다.
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 체크
        run: pnpm exec tsc --noEmit

      - name: 린트
        run: pnpm lint

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build
